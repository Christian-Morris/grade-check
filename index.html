<style>
/* Layout: navy brand bar + one focused card at a time (intro → question → results), same tokens as the main site and offer page.
   Deliberately single-theme: MT.O's light brand look on every device. */
:root {
  color-scheme: light;
  --navy: #041F60;
  --navy-deep: #031849;
  --cyan: #4DE4FF;
  --cyan-dim: #3BB5D9;
  --plum: #5B5299;
  --plum-tint: #EFEDFB;
  --body: #4A5578;
  --panel: #F6F7FC;
  --line: #E1E4F1;
  --white: #FFFFFF;
  --muted: #8A92AE;
  --good: #1D7A52;
  --good-tint: #E6F4EC;
  --warn: #9A6A08;
  --warn-tint: #FBF1DC;
  --gap: #B23A26;
  --gap-tint: #FBE9E5;
  --font-display: 'Montserrat', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
  --shell: 720px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--panel); color: var(--body);
  font-family: var(--font-body); font-size: 1.0625rem; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); color: var(--navy); line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; }
.shell { width: min(100% - 2rem, var(--shell)); margin-inline: auto; }
:where(a, button, input, select):focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } }

/* ---------- navbar ---------- */
#navbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--navy); border-bottom: 1px solid rgba(255,255,255,.1);
}
#navbar .shell { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding-block: .75rem; }
.wordmark { font-family: var(--font-display); font-size: 1.05rem; font-weight: 800; color: var(--white); white-space: nowrap; }
.wordmark .soft { font-weight: 500; color: var(--cyan); }
.nav-tag { font-size: .8rem; font-weight: 600; color: #A9B8DC; letter-spacing: .06em; text-transform: uppercase; }
.progress { height: 4px; background: rgba(255,255,255,.12); }
.progress span { display: block; height: 100%; width: 0; background: var(--cyan); transition: width .4s ease; }

/* ---------- intro ---------- */
.hero { background: var(--navy); color: #C3CEE9; padding-block: clamp(2rem, 6vw, 3.5rem) clamp(2.5rem, 7vw, 4rem); }
.hero .eyebrow { color: var(--cyan); }
.hero h1 { color: var(--white); font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -.4px; margin-top: .6rem; }
.hero .lede { font-size: clamp(1.05rem, 2.2vw, 1.2rem); margin-top: 1rem; max-width: 52ch; }
.facts { list-style: none; padding: 0; margin: 1.6rem 0 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.toast { position: fixed; left: 50%; top: 4.2rem; z-index: 50; transform: translate(-50%, -12px); opacity: 0; pointer-events: none;
  display: flex; align-items: center; gap: .7rem; width: max-content; max-width: calc(100vw - 32px);
  background: var(--navy); color: var(--white); border: 2px solid var(--cyan); border-radius: 14px; padding: .7rem 1rem;
  box-shadow: 0 10px 30px rgba(4,31,96,.25); transition: opacity .25s ease, transform .25s ease; cursor: pointer; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .t-emoji { font-size: 1.4rem; line-height: 1; }
.toast b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 1rem; }
.toast span.t-sub { display: block; font-size: .88rem; color: #C3CEE9; }
.hero-cta { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin-top: 1.6rem; }
.hero-cta .small { color: #C3CEE9; font-size: .9rem; }
.proof { list-style: none; padding: 0; margin: 1.8rem 0 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem;
  border-top: 1px solid rgba(255,255,255,.14); padding-top: 1.3rem; max-width: 46rem; }
.proof li { display: flex; flex-direction: column; gap: .15rem; }
.proof b { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.3rem, 3.4vw, 1.65rem); color: var(--white); line-height: 1.1; }
.proof b .star { color: var(--cyan); font-size: .8em; margin-right: .15rem; }
.proof b .unit { font-size: .6em; font-weight: 700; margin-left: .15rem; }
.proof li > span { font-size: .82rem; color: #C3CEE9; }
@media (max-width: 600px) { .proof { grid-template-columns: repeat(2, 1fr); row-gap: 1rem; } }
.facts li { font-size: .88rem; font-weight: 600; color: var(--navy); background: var(--cyan); border-radius: 999px; padding: .3rem .85rem; }

.eyebrow { font-family: var(--font-display); font-size: .78rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--plum); }

.intro-body { padding-block: 2rem 3rem; display: grid; gap: 1.25rem; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 14px; padding: clamp(1.25rem, 4vw, 2rem); }
.card h2 { font-size: 1.3rem; }
.steps-how { list-style: none; counter-reset: s; padding: 0; margin: 1rem 0 0; display: grid; gap: .9rem; }
.steps-how li { counter-increment: s; display: grid; grid-template-columns: 2rem 1fr; gap: .8rem; align-items: start; }
.steps-how li::before {
  content: counter(s); display: grid; place-items: center; width: 2rem; height: 2rem; border-radius: 50%;
  background: var(--plum-tint); color: var(--plum); font-family: var(--font-display); font-weight: 700; font-size: .9rem;
}
.steps-how strong { color: var(--navy); font-weight: 600; }
.honesty { background: var(--plum-tint); border-radius: 10px; padding: .9rem 1.1rem; font-size: .95rem; color: var(--navy); margin-top: 1.2rem; }

.field { display: grid; gap: .5rem; margin-top: 1rem; }
.field label { font-weight: 600; color: var(--navy); }
.years { display: flex; flex-wrap: wrap; gap: .5rem; }
.years button {
  border: 2px solid var(--line); background: var(--white); color: var(--navy); font-weight: 600;
  border-radius: 8px; padding: .55rem .9rem; cursor: pointer; min-width: 4.4rem;
}
.years button[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: var(--white); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  font-family: var(--font-display); font-weight: 700; font-size: 1rem;
  background: var(--navy); color: var(--white); border: 0; border-radius: 8px;
  padding: .85rem 1.5rem; cursor: pointer; transition: background .15s ease, opacity .15s ease;
}
.btn:hover { background: var(--navy-deep); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn--cyan { background: var(--cyan); color: var(--navy); }
.btn--cyan:hover { background: var(--cyan-dim); }
.linkbtn { background: none; border: 0; color: var(--body); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: .6rem .4rem; font-size: .95rem; }
.linkbtn:hover { color: var(--navy); }
.start-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; margin-top: 1.4rem; }
.start-row .small { font-size: .88rem; color: var(--muted); }

/* ---------- question ---------- */
.stage { padding-block: 1.5rem 3rem; }
.qmeta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: .5rem; align-items: baseline; margin-bottom: .8rem; }
.qmeta .hint { font-size: .85rem; color: var(--muted); }
.prompt { font-family: var(--font-display); font-size: clamp(1.3rem, 3.6vw, 1.65rem); font-weight: 700; color: var(--navy); line-height: 1.35; text-wrap: balance; }
.prompt .m { font-family: var(--font-display); white-space: nowrap; }
.fr { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.05; margin: 0 .15em; font-size: .9em; }
.fr > span:first-child { border-bottom: 2px solid currentColor; padding: 0 .2em .05em; }
.fr > span:last-child { padding: .05em .2em 0; }
.diagram { margin: 1.1rem 0 0; display: flex; justify-content: center; }
.diagram svg { width: 100%; max-width: 320px; height: auto; }
.dtable { border-collapse: collapse; margin: 1rem 0 0; font-variant-numeric: tabular-nums; }
.dtable th, .dtable td { border: 1px solid var(--line); padding: .45rem .9rem; text-align: center; }
.dtable th { background: var(--panel); color: var(--navy); font-weight: 600; font-size: .92rem; }

.answer { margin-top: 1.5rem; display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; }
.answer.stack { flex-direction: column; align-items: stretch; }
.answer .row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.affix { font-family: var(--font-display); font-weight: 700; font-size: 1.35rem; color: var(--navy); }
.answer input {
  font-family: var(--font-display); font-size: 1.35rem; font-weight: 700; color: var(--navy);
  border: 2px solid var(--line); border-radius: 8px; padding: .55rem .75rem; width: 8rem; max-width: 100%;
  background: var(--white); transition: border-color .15s ease;
}
.answer input.wide { width: min(22rem, 100%); font-size: 1.15rem; }
.answer input:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(77,228,255,.6); }
.answer input:disabled { background: var(--panel); color: var(--body); }
.fracin { display: inline-flex; flex-direction: column; align-items: center; gap: .3rem; }
.fracin input { width: 5.5rem; text-align: center; }
.fracin .bar { width: 6rem; height: 3px; background: var(--navy); border-radius: 2px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; margin-top: 1.5rem; }
.note { margin-top: .9rem; font-size: .95rem; color: var(--plum); min-height: 1.4em; }

.breakdown-banner { display: flex; align-items: center; gap: .6rem; background: var(--plum-tint); color: var(--navy); border-radius: 10px; padding: .7rem 1rem; font-weight: 600; margin-bottom: 1rem; }
.breakdown-banner .count { margin-left: auto; font-size: .82rem; font-weight: 600; color: var(--plum); white-space: nowrap; }
.orig { font-size: .95rem; color: var(--body); border-left: 3px solid var(--line); padding-left: .8rem; margin-bottom: 1rem; }
.orig .diagram svg { max-width: 200px; }
.stepfb { margin-top: .9rem; font-weight: 600; min-height: 1.5em; }
.stepfb.ok { color: var(--good); }
.stepfb.no { color: var(--plum); }

/* ---------- feedback ---------- */
.verdict { display: flex; align-items: center; gap: .7rem; }
.verdict .dot { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 800; font-family: var(--font-display); }
.verdict.good .dot { background: var(--good-tint); color: var(--good); }
.verdict.mid .dot { background: var(--warn-tint); color: var(--warn); }
.verdict.low .dot { background: var(--panel); color: var(--body); border: 1px solid var(--line); }
.verdict h2 { font-size: 1.3rem; }
.ans-line { margin-top: 1rem; font-size: 1.05rem; color: var(--navy); }
.ans-line strong { font-family: var(--font-display); }
.tip { margin-top: 1rem; background: var(--navy); color: #D5DDF2; border-radius: 10px; padding: 1rem 1.1rem; }
.tip .label { display: block; font-family: var(--font-display); font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--cyan); margin-bottom: .25rem; }
.breakdown-banner > span:first-child { min-width: 0; }
.breakdown-banner .why { font-weight: 400; }
.verdict-note { margin-top: .6rem; color: var(--navy); }
.probe { margin-top: 1.5rem; }
.probe h3 { font-size: 1.05rem; }
.probe p { font-size: .9rem; color: var(--muted); margin-top: .2rem; }
.probe-opts { display: grid; gap: .5rem; margin-top: .8rem; }
.probe-opts button {
  text-align: left; border: 2px solid var(--line); background: var(--white); color: var(--navy);
  border-radius: 8px; padding: .7rem .9rem; cursor: pointer; font-weight: 500;
}
.probe-opts button:hover { border-color: var(--cyan-dim); }
.probe-opts button[aria-pressed="true"] { border-color: var(--navy); background: var(--plum-tint); font-weight: 600; }

/* ---------- results ---------- */
.result-hero { background: var(--navy); color: #C3CEE9; padding-block: 2.25rem 2.75rem; }
.result-hero .eyebrow { color: var(--cyan); }
.grade-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1.25rem 2rem; margin-top: 1rem; }
.grade-badge { display: grid; place-items: center; width: 8.5rem; height: 8.5rem; border-radius: 18px; border: 2px solid var(--cyan); flex: none; }
.grade-badge .g { font-family: var(--font-display); font-weight: 800; font-size: 4.6rem; color: var(--cyan); line-height: 1; }
.grade-badge .gl { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #A9B8DC; margin-top: -.6rem; }
.grade-copy { flex: 1 1 18rem; min-width: 0; }
.grade-copy h1 { color: var(--white); font-size: clamp(1.4rem, 3.8vw, 1.9rem); font-weight: 800; }
.grade-copy p { margin-top: .6rem; max-width: 52ch; }
.range-pill { display: inline-block; margin-top: .8rem; font-size: .9rem; font-weight: 600; color: var(--navy); background: var(--cyan); border-radius: 999px; padding: .25rem .8rem; }
.result-body { padding-block: 2rem 3rem; display: grid; gap: 1.25rem; }
.labels { list-style: none; padding: 0; margin: 1rem 0 0; display: grid; gap: .8rem; }
.labels li { position: relative; padding: .9rem 1rem .9rem 2.6rem; background: var(--panel); border-radius: 10px; color: var(--navy); }
.labels li::before { content: ""; position: absolute; left: 1rem; top: 1.35rem; width: 9px; height: 9px; border-radius: 50%; background: var(--plum); }
.tier { margin-top: .6rem; }
.tier strong { color: var(--navy); }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: .6rem; margin-top: 1rem; }
.topic { border: 1px solid var(--line); border-radius: 10px; padding: .7rem .85rem; display: grid; gap: .35rem; }
.topic .name { font-weight: 600; color: var(--navy); font-size: .95rem; }
.chip { justify-self: start; font-size: .76rem; font-weight: 700; border-radius: 999px; padding: .15rem .6rem; }
.chip.secure { background: var(--good-tint); color: var(--good); }
.chip.patchy { background: var(--warn-tint); color: var(--warn); }
.chip.gap { background: var(--gap-tint); color: var(--gap); }
.chip.untested { background: var(--panel); color: var(--muted); }
details.log summary { cursor: pointer; font-family: var(--font-display); font-weight: 700; color: var(--navy); font-size: 1.1rem; }
.logwrap { overflow-x: auto; margin-top: 1rem; }
.logtable { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; min-width: 34rem; }
.logtable th, .logtable td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
.logtable th { color: var(--navy); font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
.disclaimer { font-size: .92rem; }
.placeholder { border: 2px dashed var(--line); border-radius: 14px; padding: 1.25rem; color: var(--muted); font-size: .95rem; }
.placeholder strong { color: var(--body); }

/* grade scale */
.gs { margin-top: 1.25rem; }
.gs-track { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
.gs-cell { height: 3rem; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  font-family: var(--font-display); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.gs-cell.range { background: var(--plum-tint); border-color: var(--plum-tint); color: var(--plum); }
.gs-cell.now { background: var(--navy); border-color: var(--navy); color: var(--cyan); font-size: 1.25rem; box-shadow: 0 0 0 3px var(--cyan); }
.gs-marks { position: relative; display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; margin-top: .5rem; min-height: 2.6rem; }
.gs-mark { grid-column: var(--col); grid-row: 1; font-size: .74rem; line-height: 1.25; color: var(--body); text-align: center; border-top: 3px solid var(--good); padding-top: .3rem; }
.gs-mark b { display: block; font-family: var(--font-display); color: var(--good); }
.gs-key { display: flex; flex-wrap: wrap; gap: .4rem 1.2rem; margin-top: .8rem; font-size: .85rem; color: var(--muted); }
.gs-key i { display: inline-block; width: .8rem; height: .8rem; border-radius: 3px; margin-right: .4rem; vertical-align: -1px; }
.k-now { background: var(--navy); }
.k-range { background: var(--plum-tint); border: 1px solid var(--plum); }
.paper-pick { display: inline-block; margin-top: .9rem; font-family: var(--font-display); font-weight: 700; color: var(--navy); background: var(--plum-tint); border-radius: 8px; padding: .4rem .8rem; }
.labels .evidence { display: block; margin-top: .35rem; font-size: .9rem; color: var(--plum); }
.sample-note { margin-top: 1rem; font-size: .92rem; color: var(--muted); }
.staff { border-style: dashed; }

/* ---------- roadmap ---------- */
.text-in { font: inherit; font-size: 1.05rem; color: var(--navy); border: 2px solid var(--line); border-radius: 8px; padding: .6rem .8rem; width: min(20rem, 100%); background: var(--white); }
.text-in:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px rgba(77,228,255,.6); }
.rm-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .6rem; }
.rm-opt { text-align: left; display: grid; gap: .25rem; border: 2px solid var(--line); background: var(--white); border-radius: 10px; padding: .8rem 1rem; cursor: pointer; color: var(--navy); font: inherit; }
.rm-opt[aria-pressed="true"] { border-color: var(--navy); background: var(--plum-tint); }
.rm-opt:disabled { cursor: not-allowed; opacity: .6; }
.rm-opt-t { font-family: var(--font-display); font-weight: 700; }
.rm-opt-s { font-size: .9rem; }
.rm-opt-s.ok { color: var(--good); }
.rm-opt-s.no { color: var(--gap); }
.rm-note { margin-top: .8rem; font-size: .95rem; color: var(--navy); background: var(--warn-tint); border-radius: 10px; padding: .8rem 1rem; }
.rm-note .linkbtn { padding: 0; font-weight: 600; color: var(--navy); }
.rm-title { color: var(--white); font-size: clamp(1.6rem, 4.5vw, 2.3rem); font-weight: 800; margin-top: .5rem; }
.rm-lede { margin-top: .6rem; font-size: 1.08rem; }
.rm-stats { list-style: none; padding: 0; margin: 1.2rem 0 0; display: flex; flex-wrap: wrap; gap: .5rem; }
.rm-stats li { font-size: .9rem; color: #C3CEE9; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; padding: .3rem .85rem; }
.rm-stats b { color: var(--white); font-weight: 600; }
.rm-first { border: 2px solid var(--cyan); }
.rm-table { margin-top: 1rem; display: grid; gap: .4rem; }
.rm-row { display: grid; grid-template-columns: 7.5rem repeat(var(--n), minmax(0, 1fr)); gap: .4rem; }
.rm-head > div { font-family: var(--font-display); font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--white); background: var(--navy); border-radius: 6px; padding: .35rem .6rem; }
.rm-wk { background: var(--plum-tint); border-radius: 8px; padding: .55rem .7rem; display: grid; align-content: center; }
.rm-wk b { font-family: var(--font-display); color: var(--navy); font-size: .9rem; }
.rm-wk span { font-size: .8rem; color: var(--body); font-variant-numeric: tabular-nums; }
.rm-cell { min-width: 0; background: var(--panel); border-radius: 8px; border-left: 4px solid var(--tc, var(--line)); padding: .5rem .7rem; display: grid; gap: .15rem; align-content: start; }
.rm-cell.brk, .rm-cell.empty { border-left-color: var(--line); color: var(--muted); font-style: italic; font-size: .9rem; align-content: center; }
.rm-sl { display: none; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-style: normal; }
.rm-pill { justify-self: start; font-family: var(--font-display); font-size: .66rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: .12rem .55rem; white-space: nowrap; }
.rm-pill.test_and_learn { background: var(--plum); color: var(--white); }
.rm-pill.learn { background: var(--cyan); color: var(--navy); }

    '<text x="106" y="97" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="800" font-size="17" fill="var(--plum)">?</text>' +
    '<text x="150" y="211" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="15" fill="var(--navy)">A</text>' +
    '<text x="222" y="50" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="15" fill="var(--navy)">B</text>' +

  var YESNO_NO = has(/^\s*no\b|^\s*n\s*$/);

  var ITEMS = [
    /* ---------------- Number skills: everyone, in order ---------------- */
    { id: 'n1', level: 0, topic: 'Number', prompt: 'What is ' + m('3 × 7') + '?', input: { type: 'num' }, answer: 21, display: '21',
      steps: [{ q: 'What is ' + m('3 × 5') + '?', answer: 15 }, { q: 'What is ' + m('3 × 2') + '?', answer: 6 }, { q: 'So what is ' + m('15 + 6') + '?', answer: 21 }],
      tip: 'Break harder times tables into ones you know: 3 × 7 is 3 × 5 plus 3 × 2.' },
    { id: 'n2', level: 0, topic: 'Number', prompt: 'What is ' + m('7 × 8') + '?', input: { type: 'num' }, answer: 56, display: '56',
      steps: [{ q: 'What is ' + m('7 × 2') + '?', answer: 14 }, { q: 'Now double it. What is ' + m('14 × 2') + '?', answer: 28 }, { q: 'Double it one more time. What is ' + m('28 × 2') + '?', answer: 56 }],
      tip: 'You can times by 8 by doubling 3 times: 7 → 14 → 28 → 56.' },
    { id: 'n3', level: 0, topic: 'Number', prompt: 'What is the square root of 81?', input: { type: 'num' }, answer: 9, display: '9',
      steps: [{ q: 'What is ' + m('8 × 8') + '?', answer: 64 }, { q: 'What is ' + m('10 × 10') + '?', answer: 100 }, { q: 'So which whole number times itself makes 81?', answer: 9 }],
      tip: 'A square root asks: what number times itself gives this?' },
    { id: 'n4', level: 0, topic: 'Number', prompt: 'What is the cube root of 27?', input: { type: 'num' }, answer: 3, display: '3',
      steps: [{ q: 'A cube root means a number × itself × itself. What is ' + m('2 × 2 × 2') + '?', answer: 8 }, { q: 'What is ' + m('4 × 4 × 4') + '?', answer: 64 }, { q: 'So which number, cubed, makes 27?', answer: 3 }],
      tip: 'Cube root: which number × itself × itself gives this? 3 × 3 × 3 = 27.' },
    { id: 'n5', level: 0, topic: 'Number', prompt: 'What is ' + fr(1, 2) + ' ÷ ' + fr(3, 5) + '?', input: { type: 'frac' }, answer: [5, 6], display: '5/6',

              { q: 'So what is ' + fr(1, 2) + ' × ' + fr(5, 3) + '?', input: { type: 'frac' }, answer: [5, 6], display: '5/6' }],
      tip: 'KFC: Keep the first fraction, Flip the second, Change ÷ to ×. Then multiply the tops together and the bottoms together.' },

    /* ---------------- Grade 2–3 ---------------- */
    { id: 'p1', level: 3, topic: 'Probability', prompt: 'What is the chance of rolling a 3 on a normal six-sided dice?', input: { type: 'frac' }, answer: [1, 6], display: '1/6',
      steps: [{ q: 'How many sides does a dice have?', answer: 6 }, { q: 'How many of those sides show a 3?', answer: 1 }, { q: 'Probability = the number of ways it can happen ÷ the total number of outcomes. So what is the chance of rolling a 3?', input: { type: 'frac' }, answer: [1, 6], display: '1/6' }],
      tip: 'Probability = the number of ways it can happen ÷ the total number of outcomes.' },
    { id: 's1', level: 3, topic: 'Statistics', prompt: 'What is the mean of 2, 4 and 9?', input: { type: 'num' }, answer: 5, display: '5',
      steps: [{ q: 'Add them up. What is ' + m('2 + 4 + 9') + '?', answer: 15 }, { q: 'How many numbers are there?', answer: 3 }, { q: 'So what is ' + m('15 ÷ 3') + '?', answer: 5 }],
      tip: 'Mean: add them all up, then divide by how many there are.' },
    { id: 'r0', level: 3, topic: 'Ratio', isNew: true, prompt: 'What is 25% of 80?', input: { type: 'num' }, answer: 20, display: '20',
      steps: [{ q: 'What is 50% of 80?', answer: 40 }, { q: '25% is half of 50%. What is half of 40?', answer: 20 }],
      tip: '25% is a quarter: halve it, then halve it again.' },

    /* ---------------- Grade 3–4 ---------------- */
    { id: 'r1', level: 4, topic: 'Ratio', prompt: 'There are 10 people in a room. 3 more people come in. What is the percentage increase?', input: { type: 'num', suffix: '%' }, answer: 30, display: '30%',
      steps: [{ q: 'How many more people are there?', answer: 3 }, { q: 'What percentage of 10 is 1 person?', input: { type: 'num', suffix: '%' }, answer: 10, display: '10%' }, { q: 'So if 1 person is 10%, what percentage is 3 people?', input: { type: 'num', suffix: '%' }, answer: 30, display: '30%' }],

    { id: 's2', level: 4, pri: 0, topic: 'Statistics', prompt: 'What is the median of 3, 8, 9, 1, 5?', input: { type: 'num' }, answer: 5, display: '5',

    { id: 'g2', level: 4, topic: 'Geometry', prompt: 'You’re facing north. You turn clockwise until you’re facing east. What bearing are you now facing?', input: { type: 'text', placeholder: 'Type the bearing' },

      }, display: '090°',

      tip: 'Bearings are measured clockwise from north and always have 3 figures: 090, not 90.' },

    /* ---------------- Grade 4–6 ---------------- */

      steps: [{ q: 'What does an equation always need to have in it?', input: { type: 'text', placeholder: 'Type your answer' }, check: has(/=|equal/), display: 'an equals sign (=)' },

    { id: 'g3', level: 5, topic: 'Geometry', prompt: 'A prism has a cross-section with an area of 12 cm² and a length of 5 cm. What is its volume?', input: { type: 'num', suffix: 'cm³' }, answer: 60, display: '60 cm³',

    { id: 'p2', level: 5, topic: 'Probability', prompt: 'You roll two dice and add the scores together. What is the chance the total is 3?', input: { type: 'frac' }, answer: [1, 18], display: '2/36 = 1/18',
      steps: [{ q: 'How many possible outcomes are there when you roll two dice?', answer: 36 }, { q: 'How many pairs add up to 3?', answer: 2 }, { q: 'So what is the chance the total is 3?', input: { type: 'frac' }, answer: [2, 36], display: '2/36' }],

    /* ---------------- Grade 6–7 ---------------- */
    { id: 'a2', level: 6, pri: 2, topic: 'Algebra', prompt: 'Line A is ' + m('y = 4x + 1') + '. Line B is parallel to line A. What is line B’s gradient?', input: { type: 'num' }, answer: 4, display: '4',

      if (inp.prefix) r.appendChild(el('<span class="affix">' + inp.prefix + '</span>'));
      var t = field(inp.type === 'text' ? 'wide' : '', inp.type === 'text' ? 'text' : 'decimal');
      t.setAttribute('aria-label', 'Your answer');
      if (inp.placeholder) t.placeholder = inp.placeholder;
      r.appendChild(t);
      if (inp.suffix) r.appendChild(el('<span class="affix">' + inp.suffix + '</span>'));
    }
    return {
      node: wrap,
      values: function () { return fields.map(function (f) { return f.value; }); },
      empty: function () { return fields.some(function (f) { return f.value.trim() === ''; }); },
      focus: function () { if (fields[0]) fields[0].focus(); },
      disable: function () { fields.forEach(function (f) { f.disabled = true; }); },
      onEnter: function (fn) {
        fields.forEach(function (f, i) {
          f.addEventListener('keydown', function (e) {
            if (e.key !== 'Enter') return;
            e.preventDefault();
            if (i < fields.length - 1 && fields[i + 1].value.trim() === '') fields[i + 1].focus(); else fn();
          });
        });
      }
    };
  }
  function shownValue(def, vals) {
    var t = (def.input || {}).type;
    if (t === 'frac') return vals[0] + '/' + vals[1];
    return vals.filter(function (v) { return v !== ''; }).join(', ');
  }

  /* ---------------- question ---------------- */
  // Small pop-up at the halfway point. It doesn't take focus, and it appears on the answer screen
  // after question 6, while the clock is stopped, so it never covers a question being timed.
  var HALFWAY_Q = 6;   // most checks run to 12–14 questions
  function toast(emoji, title, sub) {
    var old = document.querySelector('.toast'); if (old) old.remove();
    var t = el('<div class="toast" role="status" aria-live="polite"><span class="t-emoji" aria-hidden="true">' + emoji + '</span><div><b>' + title + '</b><span class="t-sub">' + sub + '</span></div></div>');
    document.body.appendChild(t);
    requestAnimationFrame(function () { requestAnimationFrame(function () { t.classList.add('show'); }); });
    function hide() { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 300); }
    t.addEventListener('click', hide);
    setTimeout(hide, 5000);
  }

  function nextQuestion() {
    clearTimers();
    var item = engine.next();
    if (!item) return askDetails();
    qn++;
    visit.questions = qn - 1;
    if (qn === 5) track('3. Reached question 5');
    if (qn === 10) track('4. Reached question 10');
    setBar(Math.min(94, (qn - 1) / EST_TOTAL * 100));
    cur = { item: item, t0: now(), overtime: false, given: '', away: 0, awayAt: document.hidden ? now() : null };
    renderMain();
  }

  function promptBlock(item, small) {
    return '<p class="prompt"' + (small ? ' style="font-size:1.02rem"' : '') + '>' + item.prompt + '</p>' +
      (item.diagram ? '<div class="diagram">' + item.diagram + '</div>' : '') +
      (item.extra ? item.extra : '');
  }

  function hasSteps(item) { return !!(item.steps && item.steps.length && !item.stepsOnSignal); }

  function renderMain() {
    var item = cur.item;
    var node = el('<div class="shell stage"><section class="card">' +
      '<div class="qmeta"><span class="eyebrow">Question ' + qn + ' · ' + item.topic + '</span><span class="hint">Work it out in your head</span></div>' +
      promptBlock(item) +
      '<div class="ansHost"></div>' +
      '<div class="actions"><button class="btn" type="button" id="checkBtn">Check answer</button><button class="linkbtn" type="button" id="idkBtn">I don’t know</button></div>' +
      '<p class="note" aria-live="polite"></p>' +
      '</section></div>');
    var input = buildInput(item, 'q-' + item.id);
    node.querySelector('.ansHost').appendChild(input.node);
    var note = node.querySelector('.note');
    function submit() {
      if (input.empty()) { note.textContent = 'Type an answer first, or tap “I don’t know”.'; input.focus(); return; }
      var vals = input.values(), t = (now() - cur.t0) / 1000, res = GC.check(item, vals);
      clearTimers();
      cur.given = shownValue(item, vals);
      if (res !== 'correct') cur.mistake = GC.mistakeFor(item, vals);
      if (res === 'correct') {
        var kind = cur.overtime ? 'slow' : t <= item.quick ? 'fast' : 'slow';
        var score = kind === 'fast' ? 1 : cur.overtime ? 0.6 : 0.8;
        return feedback({ score: score, kind: kind, time: t });
      }
      if (res && res.partial) return startSteps(res.startStep, 'partial');
      if (res && res.steps) return startSteps(0, 'wrong');
      if (hasSteps(item)) return startSteps(0, 'wrong');
      feedback({ score: 0, kind: 'miss', time: t });
    }
    input.onEnter(submit);
    node.querySelector('#checkBtn').addEventListener('click', submit);
    node.querySelector('#idkBtn').addEventListener('click', function () {
      clearTimers(); cur.given = 'I don’t know';
      if (hasSteps(item)) return startSteps(0, 'idk');
      feedback({ score: 0, kind: 'miss', time: (now() - cur.t0) / 1000 });
    });
    timer = setTimeout(function () {
      if (hasSteps(item)) { cur.given = '(ran out of time)'; startSteps(0, 'time'); }
      else { cur.overtime = true; note.textContent = 'Take your time. If you’re not sure, tap “I don’t know”.'; }
    }, HELP_AFTER * 1000);
    show(node);
    input.focus();
  }

  /* ---------------- stepping stones ---------------- */
  var BANNERS = {
    time: 'Let’s break this down together.',
    wrong: 'Not quite. Let’s break it down.',
    idk: 'No problem. Let’s break it down.',
    partial: 'Nearly there. One last step.'
  };
  function startSteps(from, reason) {
    cur.firstTime = (now() - cur.t0) / 1000;
    cur.steps = { from: from, idx: from, reason: reason, right: 0, lastRight: false };
    renderStep();
  }
  function renderStep() {
    clearTimers();
    var item = cur.item, st = cur.steps, step = item.steps[st.idx];
    var total = item.steps.length - st.from, k = st.idx - st.from + 1;
    var node = el('<div class="shell stage"><section class="card">' +
      '<div class="breakdown-banner"><span>' + ((cur.mistake && k === 1)
        ? (/^not quite/i.test(cur.mistake) ? '' : (st.reason === 'partial' ? 'Nearly there. ' : 'Not quite. ')) + '<span class="why">' + esc(cur.mistake) + '</span> ' + (st.reason === 'partial' ? 'One last step.' : 'Let’s break it down.')
        : BANNERS[st.reason]) + '</span>' + (total > 1 ? '<span class="count">Step ' + k + ' of ' + total + '</span>' : '') + '</div>' +
      '<div class="orig">' + promptBlock(item, true) + '</div>' +
      '<p class="prompt">' + step.q + '</p>' +
      '<div class="ansHost"></div>' +
      '<div class="actions"><button class="btn" type="button" id="stepBtn">Check</button><button class="linkbtn" type="button" id="stepIdk">I don’t know</button></div>' +
      '<p class="stepfb" aria-live="polite"></p>' +
      '</section></div>');
    var input = buildInput(step, 's-' + item.id + '-' + st.idx);
    node.querySelector('.ansHost').appendChild(input.node);
    var fb = node.querySelector('.stepfb'), btn = node.querySelector('#stepBtn'), idk = node.querySelector('#stepIdk');
    var answered = false;
    function done(vals) {
      if (answered) return;
      answered = true; clearTimers();
      var right = !!vals && GC.check(step, vals) === 'correct';
      if (right) st.right++;
      st.lastRight = right;
      input.disable(); btn.disabled = true; idk.disabled = true;
      fb.className = 'stepfb ' + (right ? 'ok' : 'no');
      fb.textContent = right ? '✓ Yes, that’s right.' : 'It’s ' + (step.display || step.answer) + '.';
      setTimeout(function () {
        if (st.idx < item.steps.length - 1) { st.idx++; renderStep(); }
        else finishSteps();
      }, right ? 900 : 1700);
    }
    function submit() {
      if (input.empty()) { fb.className = 'stepfb no'; fb.textContent = 'Type an answer first, or tap “I don’t know”.'; input.focus(); return; }
      done(input.values());
    }
    input.onEnter(submit);
    btn.addEventListener('click', submit);
    idk.addEventListener('click', function () { done(null); });
    stepTimer = setTimeout(function () { done(null); }, HELP_AFTER * 1000);
    show(node);
    input.focus();
  }
  function finishSteps() {
    var st = cur.steps, n = cur.item.steps.length - st.from, t = (now() - cur.t0) / 1000, score, kind;
    if (cur.item.stepsNoCredit) { score = 0; kind = 'miss'; }
    else if (st.reason === 'partial') { score = st.lastRight ? 0.6 : 0.3; kind = st.lastRight ? 'half' : 'partial'; }
    else if (st.lastRight && st.right === n) { score = 0.5; kind = 'guided'; }
    else if (st.lastRight) { score = 0.4; kind = 'guided'; }
    else if (st.right > 0) { score = 0.25; kind = 'partial'; }
    else { score = 0; kind = 'miss'; }
    feedback({ score: score, kind: kind, time: t });
  }

  /* ---------------- feedback + "what got in the way" ---------------- */
  function feedback(outcome) {
    clearTimers();
    var item = cur.item;
    outcome.given = cur.given;
    outcome.mistake = cur.mistake || null;
    outcome.away = Math.round(awayNow());
    outcome.firstTry = cur.steps ? cur.steps.reason : 'direct';
    outcome.firstTime = cur.steps ? cur.firstTime : outcome.time;
    var v = outcome.score >= 0.8 ? 'good' : outcome.score >= 0.4 ? 'mid' : 'low';
    var title = outcome.kind === 'fast' ? 'Spot on, and quick.'
      : outcome.score >= 0.8 ? 'Correct.'
      : outcome.kind === 'half' ? 'Nearly there.'
      : outcome.score >= 0.4 ? 'Got there with a bit of help.'
      : outcome.score > 0 ? 'Part of the way there.' : 'Not this time.';
    var mark = v === 'good' ? '✓' : v === 'mid' ? '~' : '–';
    var needProbe = item.level > 0 && outcome.score < 0.8;
    var node = el('<div class="shell stage"><section class="card">' +
      '<div class="verdict ' + v + '"><span class="dot" aria-hidden="true">' + mark + '</span><h2>' + title + '</h2></div>' +
      ((outcome.mistake && !cur.steps) ? '<p class="verdict-note">' + esc(outcome.mistake) + '</p>' : '') +
      '<p class="ans-line">Answer: <strong>' + esc(item.display) + '</strong></p>' +
      '<p class="tip"><span class="label">Quick win</span>' + esc(item.tip) + '</p>' +
      (needProbe ? '<div class="probe"><h3>What got in the way most?</h3><p>Pick the one that fits best. This helps us work out what to fix.</p><div class="probe-opts" role="group" aria-label="What got in the way"></div></div>' : '') +
      '<div class="actions"><button class="btn" type="button" id="nextBtn"' + (needProbe ? ' disabled' : '') + '>Next question</button></div>' +
      '</section></div>');
    var nextBtn = node.querySelector('#nextBtn');
    if (needProbe) {
      var opts = node.querySelector('.probe-opts');
      GC.PROBES.forEach(function (p) {
        var b = el('<button type="button" id="pr-' + p.id + '" aria-pressed="false">' + esc(p.text) + '</button>');
        b.addEventListener('click', function () {
          opts.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
          b.setAttribute('aria-pressed', 'true');
          outcome.probe = p.id;
          nextBtn.disabled = false;
          nextBtn.focus();
        });
        opts.appendChild(b);
      });
    }
    nextBtn.addEventListener('click', function () { engine.record(item, outcome); nextQuestion(); });
    show(node);
    if (!needProbe) nextBtn.focus();
    // Shown on the answer screen (clock stopped) rather than over the next question.
    if (qn === HALFWAY_Q) toast('🙌', 'You’re halfway there!', 'Great work so far. Keep going, just a few more to go.');
  }

  /* ---------------- next-grade copy (written per grade, not from their answers) ---------------- */
  function gradeScale(r) {
    var cells = '';
    for (var g = 1; g <= 9; g++) {
      var cls = g === r.grade ? ' now' : (g >= r.lo && g <= r.hi) ? ' range' : '';
      cells += '<div class="gs-cell' + cls + '"><span>' + g + '</span></div>';
    }
    // Markers show the next grade that matters to this family, so they never sit uselessly below the result.
    var marks = r.perfect ? []
      : r.grade <= 4 ? [[4, 'Standard pass'], [5, 'Strong pass']]
      : r.grade <= 6 ? [[7, 'A-level Maths']]
      : [[7, 'A-level Maths'], [9, 'Top grade']];
    var aria = 'Grade scale from 1 to 9. Estimated grade ' + r.grade + '.' + marks.map(function (mk) { return ' Grade ' + mk[0] + ': ' + mk[1] + '.'; }).join('');
    return '<div class="gs" role="img" aria-label="' + aria + '">' +
      '<div class="gs-track">' + cells + '</div>' +
      (marks.length ? '<div class="gs-marks">' + marks.map(function (mk) { return '<span class="gs-mark" style="--col:' + mk[0] + '"><b>' + mk[0] + '</b> ' + mk[1] + '</span>'; }).join('') + '</div>' : '') +
      '<div class="gs-key"><span><i class="k-now"></i>Grade today</span><span><i class="k-range"></i>Likely range</span></div>' +
    '</div>';
  }

  function scaleCopy(r) {
    if (r.perfect) return 'That’s the top grade. Now we aim for full marks!';
    if (r.grade === 8) return 'That’s 1 grade below the top grade, and above what many sixth forms ask for to study A-level Maths.';
    if (r.grade === 7) return 'That’s the grade many sixth forms ask for to study A-level Maths. The next question is how close to a 9 they can get.';
    if (r.grade >= 5) { var g7 = 7 - r.grade; return 'That’s ' + g7 + ' grade' + (g7 > 1 ? 's' : '') + ' below what many sixth forms ask for to study A-level Maths.'; }
    if (r.grade === 4) return 'That’s a standard pass today, but only just. A few dropped marks on the day could take it below.';
    var gap = 4 - r.grade;
    return 'That’s ' + gap + ' grade' + (gap > 1 ? 's' : '') + ' below a standard pass today.';
  }

  /* ---------------- results ---------------- */
  /* ---------------- TESTING: skip the questions with a preset student ---------------- */
  function testRun(grade, y) {
    year = y; details = { name: 'Alex', target: grade + 2 }; engine = GC.create(y); qn = 0;
    function O(score, kind, extra) { var o = { score: score, kind: kind, time: kind === 'fast' ? 4 : 22, firstTry: 'direct', given: '(test)' }; for (var k in extra) o[k] = extra[k]; o.firstTime = o.firstTime == null ? o.time : o.firstTime; return o; }
    var outcome = grade === 3
      ? function (it) {                       // solid number skills (one slow), fine at grade 2–3, struggles from 3–4 up
          if (it.level === 0) return it.id === 'n4' ? O(0.8, 'slow', { time: 14 }) : O(1, 'fast');
          if (it.level === 3) return O(1, 'fast');
          return O(0.4, 'guided', { firstTry: 'wrong', firstTime: 25, probe: it.level === 4 ? 'forgot' : 'notTaught' });
        }
      : function (it) {                       // quick slip on 7 × 8, solid to grade 6–7, stuck above that
          if (it.id === 'n2') return O(0.5, 'guided', { firstTry: 'wrong', firstTime: 3, given: '54', mistake: 'That’s 6 × 9. 7 × 8 is one of the most commonly mixed-up times tables.' });
          if (it.level <= 6) return O(1, 'fast');
          return O(0, 'miss', { probe: it.level === 7 ? 'stuck' : 'forgot', given: 'I don’t know' });
        };
    var it;
    while ((it = engine.next())) { engine.record(it, outcome(it)); qn++; }
    engine.state.year = y;
    results();
  }

  /* ---------------- end of test: a few questions for the parent ---------------- */
  var details = { name: '', target: null };
  function askDetails() {
    visit.questions = qn; track('5. Finished the questions');
    clearTimers();
    setBar(100);
    var node = el('<div class="shell stage"><section class="card">' +
      '<span class="eyebrow">That’s the last question</span>' +
      '<h2 style="margin-top:.4rem">A few quick questions for you, then the results</h2>' +
      '<p class="tier">These are for the parent to answer.</p>' +
      '<div class="field"><label for="d-name">Your child’s first name</label><input id="d-name" class="text-in" type="text" maxlength="30" autocomplete="off" placeholder="First name"></div>' +
      '<div class="field"><label>Which year are they in?</label><div class="years" id="d-years" role="group" aria-label="School year">' +
        ['9', '10', '11'].map(function (y) { return '<button type="button" id="yr-' + y + '" data-y="' + y + '" aria-pressed="false">Year ' + y + '</button>'; }).join('') +
        '<button type="button" id="yr-resit" data-y="resit" aria-pressed="false">Resitting</button>' +
      '</div></div>' +
      '<div class="field"><label>What grade are they aiming for?</label><div class="years" id="d-targets" role="group" aria-label="Target grade">' +
        [4, 5, 6, 7, 8, 9].map(function (g) { return '<button type="button" id="tg-' + g + '" data-g="' + g + '" aria-pressed="false">Grade ' + g + '</button>'; }).join('') +
        '<button type="button" id="tg-unsure" data-g="" aria-pressed="false">Not sure yet</button>' +
      '</div></div>' +
      '<div class="start-row"><button class="btn" id="seeBtn" type="button" disabled>See the results</button></div>' +
      '</section></div>');
    var see = node.querySelector('#seeBtn'), picked = { year: false, target: false };
    function group(sel, fn) {
      node.querySelectorAll(sel + ' button').forEach(function (b) {
        b.addEventListener('click', function () {
          node.querySelectorAll(sel + ' button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
          fn(b); see.disabled = !(picked.year && picked.target);
        });
      });
    }
    group('#d-years', function (b) { year = b.getAttribute('data-y'); picked.year = true; });
    group('#d-targets', function (b) { var g = b.getAttribute('data-g'); details.target = g ? Number(g) : null; picked.target = true; });
    see.addEventListener('click', function () {
      details.name = node.querySelector('#d-name').value.trim();
      engine.state.year = year;
      results();
    });
    show(node);
    node.querySelector('#d-name').focus();
  }

  function results() {
    clearTimers();
    setBar(100);
    var r = engine.result();
    var gradeLine = r.perfect
      ? 'If they sat GCSE Maths today, we’d expect a grade 9.'
      : 'If they sat GCSE Maths today, we’d expect at least a grade ' + r.grade + '.';
    var node = el('<div>' +
      '<section class="result-hero"><div class="shell">' +
        '<span class="eyebrow">Your grade check result</span>' +
        '<div class="grade-row">' +
          '<div class="grade-badge" aria-label="Estimated grade ' + r.grade + '"><span class="g">' + r.grade + '</span><span class="gl">Grade today</span></div>' +
          '<div class="grade-copy"><h1>' + gradeLine + '</h1>' +
            '<span class="range-pill">' + (r.perfect ? 'Every answer right, first time' : 'Somewhere between a grade ' + r.lo + ' and a ' + r.hi) + '</span>' +
            '<p>This is based on what they can do today, without a calculator or time to revise. It’s an indication, not an exam score. The way to confirm it is a full past paper, marked against the official mark scheme.</p>' +
          '</div>' +
        '</div>' +
      '</div></section>' +
      '<div class="shell result-body">' +
        '<section class="card"><span class="eyebrow">Where that sits</span><h2 style="margin-top:.4rem">' + scaleCopy(r) + '</h2>' + gradeScale(r) + '</section>' +
        '<section class="card"><span class="eyebrow">What’s holding them back</span><h2 style="margin-top:.4rem">From your answers, it seems like you…</h2>' +
          '<ul class="labels">' + r.labels.map(function (k) { return '<li>' + esc(GC.LABELS[k]) + (r.evidence[k] ? '<span class="evidence">' + esc(r.evidence[k]) + '</span>' : '') + '</li>'; }).join('') + '</ul>' +
        '</section>' +
        '<div id="rm-host"></div>' +
        '<section class="card"><span class="eyebrow">Higher or Foundation</span><h2 style="margin-top:.4rem">Which paper is likely the right choice for you?</h2>' +
          '<p class="paper-pick">' + esc(r.tier.tier) + '</p>' +
          '<p class="tier">' + esc(r.tier.why) + '</p></section>' +
        (SHOW_STAFF ? staffLog(r) : '') +
        '<div><button class="btn btn--cyan" type="button" id="againBtn">Start again</button></div>' +
      '</div></div>');
    node.querySelector('#againBtn').addEventListener('click', intro);
    lastResult = r;
    track('6. Saw results', { year: year === 'resit' ? 'Resitting' : year ? 'Year ' + year : '', grade: r.grade, target: details.target || '' });
    mountRoadmapStep(node.querySelector('#rm-host'), r);
    resultsNode = node;
    show(node);
  }

  /* Staff-only: open the page with #staff on the end of the link to see this. */
  function staffLog(r) {
    var KIND = { fast: 'Correct, quick', slow: 'Correct, slower', half: 'Nearly (one step off)', guided: 'With help', partial: 'Partly, with help', miss: 'Not yet' };
    var FIRST = { direct: '', wrong: 'Wrong first, then steps', idk: 'Said “I don’t know”, then steps', time: 'Ran out of time, then steps', partial: 'Half right, then last step' };
    var STATUS = { secure: 'Secure', patchy: 'Patchy', gap: 'Gap', untested: 'Not reached' };
    var PROBE_TXT = {}; GC.PROBES.forEach(function (p) { PROBE_TXT[p.id] = p.text; });
    return '<section class="card staff"><span class="eyebrow">Staff view · not shown to parents</span>' +
      '<p class="sample-note" style="margin-top:.4rem">Raw score ' + r.raw.toFixed(2) + ' · highest secure level ' + (r.secure || 'none') + ' · number skills base ' + r.numberBase + ' · labels: ' + r.labels.join(', ') + (r.log.some(function (e) { return e.away; }) ? ' · <strong style="color:var(--gap)">left the page during ' + r.log.filter(function (e) { return e.away; }).length + ' question(s): treat with caution</strong>' : '') + '</p>' +
      '<p class="sample-note">Topics: ' + r.topics.filter(function (t) { return t.status !== 'untested'; }).map(function (t) { return t.topic + ' ' + STATUS[t.status]; }).join(' · ') + '</p>' +
      '<div class="logwrap"><table class="logtable"><thead><tr><th>#</th><th>Question</th><th>Their answer</th><th>Result</th><th>First try</th><th>Time</th><th>Left page</th><th>What got in the way</th></tr></thead><tbody>' +
      r.log.map(function (e, i) {
        var it = GC.ITEMS.filter(function (x) { return x.id === e.id; })[0];
        return '<tr><td>' + (i + 1) + '</td><td>' + it.prompt.replace(/<(?!\/?(span|sup)\b)[^>]+>/g, '') + '</td><td>' + esc(e.given || '') + (e.mistake ? '<br><em style="color:var(--warn)">' + esc(e.mistake) + '</em>' : '') + '</td><td>' + KIND[e.kind] + '</td><td>' + (FIRST[e.firstTry] || '') + (e.firstTry !== 'direct' ? ' (' + Math.round(e.firstTime) + 's)' : '') + '</td><td>' + Math.round(e.time) + 's</td><td>' + (e.away ? '<strong style="color:var(--gap)">' + e.away + 's away</strong>' : '') + '</td><td>' + (e.probe ? esc(PROBE_TXT[e.probe]) : '') + '</td></tr>';
      }).join('') +
      '</tbody></table></div></section>';
  }


  /* ==================== ROADMAP: goal questions + roadmap page ==================== */
  var ENROL_URL = 'https://www.mathstutorsonline.uk/roadmap-onboarding';
  var CALL_URL = 'https://api.leadconnectorhq.com/widget/bookings/gcse-maths-strategy-call-grade-check';
  /* The booking calendar fills in its standard contact fields from the link. Its custom questions
     can't be filled this way (tested), so those come through Airtable instead. */
  function callLinkFor(c) {
    var parts = c.parentName.trim().split(/\s+/), first = parts.shift() || '', last = parts.join(' ');

  function feasibilitySummary(r) {
    var start = RM.nextStart(new Date()), cur = r.grade, t = details.target, examYear = null;
    // Fewest sessions a week (1–7) that complete the full course for grade g in time, or null.
    function minSessions(g) {
      for (var n = 1; n <= 7; n++) {
        var o = RM.build({ schoolYear: 11, current: cur, target: g, sessions: n, start: start });

    }
    var others = [];
    // Higher grades only ever need more time, so list grades until the first one that isn't
    // possible and show it as "grade X+ → not possible".
    for (var g = cur + 1; g <= 9; g++) {
      if (g === t) continue;
      if (targetImpossible && g > t) break;          // already covered by the target line
      var x = minSessions(g);
      if (!x) { others.push('grade ' + g + (g < 9 ? '+' : '') + ' → not possible'); break; }
      others.push('grade ' + g + ' → ' + x.n + '/wk');
    }

    var t = CURRICULUM[w.tier][w.topic];
    var sub = w.weekInTopic < RM.WEEKS_PER_TOPIC ? t.s[w.weekInTopic - 1] : 'All five ' + t.n + ' subtopics';
    return '<div class="rm-cell" style="--tc:' + t.c + '">' + label +
      '<span class="rm-pill ' + w.mode + '">' + MODE[w.mode] + '</span>' +
      '<span class="rm-topic">' + esc(t.n) + '</span><span class="rm-sub">' + esc(sub) + '</span></div>';
  }
  function rmRows(rows, n) {
    return rows.map(function (row) {
      var cells = ''; for (var i = 0; i < n; i++) cells += rmCell(row.cells[i], n, i);
      return '<div class="rm-row" style="--n:' + n + '"><div class="rm-wk"><b>Week ' + row.week + '</b><span>' + dShort(row.monday) + ' – ' + dShort(RM.add(row.monday, 6)) + '</span></div>' + cells + '</div>';
    }).join('');
  }
  function rmHead(n) {
    var h = '<div class="rm-row rm-head" style="--n:' + n + '"><div>Week</div>';
    for (var i = 0; i < n; i++) h += '<div>' + (n > 1 ? 'Session ' + (i + 1) : 'Weekly session') + '</div>';
    return h + '</div>';
  }

  function renderRoadmap(name, r, target, n, start) {
    var o = RM.build({ schoolYear: Number(year), current: r.grade, target: target, sessions: n, start: start });
    var who = esc(name), whoS = esc(poss(name));
    var tiers = o.plan.map(function (p) { return p[0]; });
    var tracker = tiers.map(function (tier) {
      return (tiers.length > 1 ? '<p class="rm-tier">' + (tier === 'higher' ? 'Higher' : 'Foundation') + '</p>' : '') +
        '<div class="rm-topics">' + CURRICULUM[tier].map(function (t) { return '<span style="--tc:' + t.c + '">' + esc(t.n) + '</span>'; }).join('') + '</div>';
    }).join('');
    var first6 = o.rows.slice(0, 6);
    var node = el('<div>' +
      '<section class="result-hero"><div class="shell">' +
        '<span class="eyebrow">Your MT.O roadmap</span>' +
        '<h1 class="rm-title">' + whoS + ' GCSE Maths Roadmap</h1>' +
        '<p class="rm-lede">From a grade ' + r.grade + ' today to a grade ' + target + ', in time for the May ' + o.examYear + ' exams.</p>' +
        '<ul class="rm-stats">' +
          '<li><b>' + n + '</b> session' + (n > 1 ? 's' : '') + ' a week</li>' +
          '<li><b>' + tierText(o.plan) + '</b></li>' +
          '<li>Starts <b>w/c ' + dLong(o.rows[0].monday) + '</b></li>' +
          '<li>Full course done by <b>' + dMonth(o.end) + '</b></li>' +
        '</ul>' +
      '</div></section>' +
      '<div class="shell result-body">' +
        '<section class="card rm-first"><span class="eyebrow">Where ' + who + ' would start</span><h2 style="margin-top:.4rem">The first 6 weeks</h2>' +
          '<p class="tier">This is the first block of the roadmap. Each weekly session works through one topic, taught live by an MT.O tutor, and ' + who + ' is assessed at the start and end so you can see the progress for yourself.</p>' +
          '<div class="rm-table">' + rmHead(n) + rmRows(first6, n) + '</div>' +
          '<div class="start-row"><a class="btn btn--cyan" href="' + ENROL_URL + '" target="_blank" rel="noopener">Start the first 6 weeks</a><span class="small">Watch the short video and enrol on the next page.</span></div>' +
        '</section>' +
        '<section class="card"><span class="eyebrow">How the roadmap works</span><h2 style="margin-top:.4rem">Six weeks per topic, in a set order</h2>' +
          '<ul class="rm-legend"><li><span class="rm-pill test_and_learn">Test & Learn</span>Week 1: a short test to see what they already know, then the first lesson</li>' +
          '<li><span class="rm-pill learn">Learn</span>Weeks 2 to 5: one subtopic a week</li>' +
          '<li><span class="rm-pill recap_and_test">Recap & Test</span>Week 6: recap the whole topic, then test it</li></ul>' +
          '<p class="tier">This plan is the amount of tuition MT.O’s average student needs to reach their target grade, because it covers the entire GCSE curriculum. Christmas (2 weeks) and Easter (1 week) are shown as breaks.</p>' +
          '<h3 class="rm-h3">Topics covered</h3>' + tracker +
        '</section>' +
        '<section class="card"><span class="eyebrow">Week by week</span><h2 style="margin-top:.4rem">The full roadmap: ' + o.rows.length + ' weeks</h2>' +
          '<details class="rm-all"><summary>Show all ' + o.rows.length + ' weeks</summary><div class="rm-table">' + rmHead(n) + rmRows(o.rows, n) + '</div></details>' +
        '</section>' +
        '<section class="card rm-cta"><h2>Ready to start ' + whoS + ' first 6 weeks?</h2>' +
          '<p class="tier">Watch the short video to see exactly how the sessions work, then pick a time that suits you.</p>' +
          '<div class="start-row"><a class="btn btn--cyan" href="' + ENROL_URL + '" target="_blank" rel="noopener">Start the first 6 weeks</a>' +
          '<button class="linkbtn" type="button" id="rm-back">Back to the results</button></div>' +
        '</section>' +
      '</div></div>');
    var back = node.querySelector('#rm-back');
    if (!resultsNode) back.textContent = 'Take the grade check again';
    back.addEventListener('click', function () { if (resultsNode) show(resultsNode); else { history.replaceState(null, '', location.pathname); intro(); } });
    show(node);
  }

  /* ==================== VISIT TRACKING → Airtable "Grade Check Visits" ====================
     One row per visitor, updated with the furthest step reached. Sent when the visitor leaves
     or hides the page, and straight away at the key end points, so drop-offs are recorded too.
     No cookies and nothing personal (the email is only added once they've given it). */
  var VISIT_WEBHOOK_URL = 'https://hooks.airtable.com/workflows/v1/genericWebhook/appBt9tJUbqGrTsXP/wfl6q2r7pOaOj9AAn/wtrbmf5IuuPjKCvoR';
  var STEPS = ['1. Landed', '2. Started', '3. Reached question 5', '4. Reached question 10', '5. Finished the questions',
               '6. Saw results', '7. Started typing their details', '8. Built roadmap', '9. Clicked enrol', '9. Clicked book a call'];
  var visit = (function () {
    var q = new URLSearchParams(location.search), src = q.get('utm_source') || q.get('src') || q.get('ref') || '';
    if (!src) { try { src = document.referrer ? new URL(document.referrer).hostname : 'direct'; } catch (e) { src = 'direct'; } }
    return { id: 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), t0: Date.now(), step: 0, sentStep: -1,
             source: src.slice(0, 80), campaign: (q.get('utm_campaign') || '').slice(0, 80),
             device: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Phone/tablet' : 'Computer',
             questions: 0, year: '', grade: '', target: '', email: '' };
  })();
  function track(stepName, extra) {
    var i = STEPS.indexOf(stepName);
    if (i > visit.step) visit.step = i;
    if (extra) Object.keys(extra).forEach(function (k) { if (extra[k] !== undefined && extra[k] !== null && extra[k] !== '') visit[k] = extra[k]; });
  }
  function flushVisit(force) {
    if (!VISIT_WEBHOOK_URL || (!force && visit.step === visit.sentStep)) return;
    visit.sentStep = visit.step;
    var f = new URLSearchParams();
    f.append('visitId', visit.id); f.append('furthestStep', STEPS[visit.step]); f.append('stepNumber', String(Math.min(visit.step, 8) + 1));
    f.append('questionsAnswered', String(visit.questions)); f.append('minutes', (Math.round((Date.now() - visit.t0) / 6000) / 10).toFixed(1));
    f.append('device', visit.device); f.append('source', visit.source);
    ['campaign', 'year', 'grade', 'target', 'email'].forEach(function (k) { if (visit[k] !== '') f.append(k, String(visit[k])); });
    var body = f.toString();
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(VISIT_WEBHOOK_URL, new Blob([body], { type: 'application/x-www-form-urlencoded' }))) return;
    } catch (e) {}
    try { fetch(VISIT_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body }).catch(function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) flushVisit(); });
  window.addEventListener('pagehide', function () { flushVisit(); });
  document.addEventListener('input', function (e) {
    if (e.target.id && /-(pname|email|phone)$/.test(e.target.id)) track('7. Started typing their details');
  }, true);
  // Enrol / book clicks are the end of the journey: record them straight away.
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href]');
    if (!a) return;
    if (a.href.indexOf(ENROL_URL) === 0) { track('9. Clicked enrol'); flushVisit(); }
  }, true);

  // Opened from the roadmap link in the results email: show that roadmap straight away.
  // If the start week in the link has passed, it moves to the next available start.
  function openRoadmapFromLink() {
    var h = location.hash.match(/^#roadmap\?(.*)$/);
    if (!h) return false;
    var q = new URLSearchParams(h[1]), y = q.get('y'), g = Number(q.get('g')), t = Number(q.get('t')), n = Number(q.get('n')),
        sm = (q.get('s') || '').match(/^(\d{4})-(\d{2})-(\d{2})$/), name = (q.get('name') || '').slice(0, 40);
    if (!/^(9|10)$/.test(y) || !(g >= 1 && g <= 9) || !(t > g && t <= 9) || !(n >= 1 && n <= 7) || !name) return false;
    var start = sm ? RM.D(+sm[1], +sm[2], +sm[3]) : null, next = RM.nextStart(new Date());
    if (!start || start < next) start = next;
    year = y; details = { name: name, target: t };
    try { renderRoadmap(name, { grade: g }, t, n, start); } catch (e) { return false; }
    return true;
  }
  if (!openRoadmapFromLink()) intro();
})();
</script>
